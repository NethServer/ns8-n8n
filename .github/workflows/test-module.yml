name: Test module
# The run belongs to the default branch under workflow_run: name the tested one.
run-name: "Test ${{ github.event.workflow_run.head_branch || github.ref_name }} on QEMU"

on:
  workflow_dispatch:
    inputs:
      debug_shell:
        description: "Debug shell"
        required: true
        type: boolean
  workflow_run:
    workflows: ["Publish images"]
    types: [completed]

jobs:
  run:
    name: "Run ${{ matrix.scenario }} tests"
    strategy:
      # The shared screenshot publisher has one slot per branch.
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - distro: rocky9
            scenario: install
          - distro: debian13
            scenario: update
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    uses: NethServer/ns8-github-actions/.github/workflows/test-module-qemu.yml@v1
    with:
      # The shared runner enables a browser on one guest per call.
      distros: ${{ format('["{0}"]', matrix.distro) }}
      scenarios: ${{ format('["{0}"]', matrix.scenario) }}
      ui_tests_strategy: always
      debug_shell: ${{ github.event.inputs.debug_shell == 'true' }}
      # Other inputs: https://github.com/NethServer/ns8-github-actions/blob/v1/docs/test-module-qemu.md#inputs
